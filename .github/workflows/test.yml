# Runs the hub's own checks on every push.
#
# Until now nothing did. The three suites below existed in a repo with no remote, so they
# only ran when someone remembered to type the command — and a hub deploy was push-and-hope.
# Cloudflare publishes this repo on push regardless of what happens here; treat a red run as
# "roll it back", not "it never went out".
#
# No package.json in this repo on purpose: it holds static assets that Cloudflare serves
# directly, and adding one risks changing how the deploy is detected. Playwright is
# installed into a scratch directory instead.
name: hub tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Reading a run log needs a token and there isn't one, so a red build could only ever
      # say which STEP failed. The suites write the labels of the checks that failed here,
      # and the last step turns them into an ARTIFACT NAME — artifact names come back from
      # the public API, so the name is the diagnosis. See test/diag.mjs.
      # A literal path, not ${{ runner.temp }}: the `runner` context does not exist yet when
      # job-level env is evaluated, and using it there does not fail the step — it fails the
      # whole workflow before a single job is created, which reads from the API as an
      # ordinary red build with no steps at all.
      GP_DIAG: /tmp/failing-checks.txt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright + Chromium
        run: |
          npm init -y --silent
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium

      # The inline script is ~5,000 lines in one HTML file, so a syntax error takes the whole
      # app down at once. Cheapest possible check, run before anything expensive.
      - name: Inline scripts parse
        run: |
          node -e "
          const fs=require('fs');
          for (const f of ['dist/index.html','dist/stickers.html']) {
            const t=fs.readFileSync(f,'utf8');
            const parts=[...t.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m=>m[1]).filter(s=>s.trim());
            fs.writeFileSync('/tmp/'+f.replace(/[^a-z]/gi,'_')+'.js', parts.join('\n;\n'));
            console.log(f, parts.length, 'inline block(s)');
          }"
          for f in /tmp/*.js; do node --check "$f"; done

      # dist/ is what Cloudflare serves. index.html here at the root is a pre-dist leftover
      # and nothing reads it, but stickers.html exists in both and they must not drift.
      - name: stickers.html matches dist
        run: diff stickers.html dist/stickers.html

      # The network here rewrites pages in flight; one such page was saved and committed,
      # and its injected scripts reached production. Cheap, and it runs before the browser.
      - name: Pages load nothing from outside their origin
        run: node test/test-self-contained.mjs

      - name: Hub — edit/delete, sales page, warranty register
        run: node test/test-hub-jobedit.mjs

      # A dropped punch is a day worked for free, and worker_punches is the one table an
      # anonymous stranger can write to.
      - name: Worker clock — offline queue and the approval gate
        run: node test/test-worker-clock.mjs

      - name: Sticker — saved layout is versioned
        run: node test/test-sticker-state.mjs

      - name: Sticker — every sticker is recorded
        run: node test/test-sticker-history.mjs

      # A printed spec that overstates the pack is a warranty problem, not a cosmetic one.
      - name: Sticker — printed current never exceeds the BMS
        run: node test/test-sticker-specs.mjs

      # The bytes the phone sends to the label printer. Inverted polarity here prints a
      # solid black label and eats a metre of ribbon, and nothing in TSPL reports it.
      - name: Sticker — the TSPL the printer receives
        run: node test/test-tspl.mjs

      # Fails on marks overflowing the artboard, text spilling its column, or a font weight
      # with no loaded face — all three have shipped to a printer before.
      - name: Sticker — renders, both modes
        env:
          STICKER_OUT: ${{ runner.temp }}/stickers
        run: |
          node test/render-sticker-pdf.mjs --volt 72 --cap 60 --out ci-new
          node test/render-sticker-pdf.mjs --repair --out ci-repair

      - name: Upload the rendered stickers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sticker-renders
          path: ${{ runner.temp }}/stickers/*.png
          if-no-files-found: ignore

      # Names the failing assertion in a place that can be read without a token.
      - name: Name the failing assertion
        if: failure()
        id: diag
        run: |
          if [ -s "$GP_DIAG" ]; then
            echo "slug=$(tr -d '\n' < "$GP_DIAG")" >> "$GITHUB_OUTPUT"
          else
            # The step that failed did not get as far as an assertion — a crash, an install,
            # the diff, or the parse check. Say so rather than implying a passing suite.
            echo "slug=step-failed-before-any-assertion" >> "$GITHUB_OUTPUT"
            echo "no assertion recorded" > "$GP_DIAG"
          fi

      - name: Publish the diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FAILED--${{ steps.diag.outputs.slug }}
          path: ${{ env.GP_DIAG }}
